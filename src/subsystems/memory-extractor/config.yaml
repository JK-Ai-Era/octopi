id: memory.extractor
name: Memory Extractor
description: 从主会话生命周期事件中提取结构化记忆候选（规则+LLM混合模式）

sense:
  source: eventBus
  filter:
    events: ['session.lifecycle.updated', 'memory.extractor.bundle.ready']
    # sessionLifecycle/extractionStatus 来自 SenseContext（engine 从 eventData 映射）
    # eventData.bundle 由 MemoryExtractorBridge / PendingExtractor 在 trigger 时注入
    condition: "(sessionLifecycle === 'recent' && extractionStatus === 'pending') || (eventData?.bundle != null)"
  isolation: structured

think:
  # handler 自包含「规则提取 → 可选 LLM 增强 → 去重/阈值入库」
  # 不是 think 的 preProcess→LLM→postProcess 链，因此 implementation 为 code
  implementation: code
  strategy: heuristic
  model: mini
  maxIterations: 1

act:
  mode: inject

signal:
  severity: info
  channel: [context, event]

boundary:
  visibility: structured
  authority: act
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: session

lifecycle:
  maxConcurrent: 1

runtimeInject:
  requires:
    - memoryStore
  # llmPort 由 SubsystemRuntime 自动注入（含 SUBSYSTEM.md 认知指令 + 模型 fallback）

observability:
  eventPrefix: memory.extractor

resume:
  enabled: true
  scanIntervalMs: 30000
  maxRetries: 5
  baseRetryMs: 60000
  maxRetryMs: 600000

metadata:
  config:
    minConfidence: 0.6
    minImportance: 0.6
    llmEnrichment:
      temperature: 0.3
      maxTokens: 2048
