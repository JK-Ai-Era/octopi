id: cognition.steward.conceptualize
name: Cognition Steward Conceptualize
description: 命题+语境 → 概念图谱（持证关系；写 concepts/concept_edges）

sense:
  source: eventBus
  filter:
    condition: "true"
    events: ['cognition.conceptualize.request']
    emits: ['cognition.conceptualized']
  isolation: isolated

think:
  # code = 调 handler.ts 确定性实现（llm 模式是自由 decide，handler 从未执行——2026-10-30 修复）
  implementation: code
  strategy: single
  maxIterations: 1

act:
  mode: inject

signal:
  severity: info
  channel: [event]

boundary:
  visibility: isolated
  authority: act
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: agent

lifecycle:
  maxConcurrent: 1
  maxDurationMs: 120000

runtimeInject:
  requires: ['conceptGraphStore']

observability:
  eventPrefix: cognition.steward.conceptualize

metadata:
  config:
    maxNodesPerProposition: 6
    maxEdgesPerProposition: 12
    maxTokens: 8192
