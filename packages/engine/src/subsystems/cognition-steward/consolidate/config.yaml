id: cognition.steward.consolidate
name: Cognition Steward Consolidate
description: 概念图巩固：衰减、晋升、GC、容量检查（事件+TTL）

sense:
  source: schedule
  # 24h 节拍 + 重启首跳兜底：interval 计时器随进程重启清零（PulseScheduler 无 catch-up，
  # OP-9R 记账），部署重启周期 < 24h 时纯 interval 会被饿死——runOnStart 保证每次启动必跑一轮
  interval: 86400000
  runOnStart: true
  filter:
    condition: "true"
    events: ['cognition.consolidate.request', 'session.ended', 'memory.steward.governed']
    emits: ['cognition.consolidated']
  isolation: isolated

think:
  implementation: code
  strategy: deterministic
  maxIterations: 1

act:
  mode: inject

signal:
  severity: info
  channel: [event]

boundary:
  visibility: isolated
  authority: act
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: agent

lifecycle:
  maxConcurrent: 1
  maxDurationMs: 60000

runtimeInject:
  requires: ['conceptGraphStore', 'memoryStore']

observability:
  eventPrefix: cognition.steward.consolidate

metadata:
  config:
    promoteMinSupport: 3
    warnNodes: 5000
    warnEdges: 20000
    stopNodes: 10000
    stopEdges: 40000
    adjudicateMaxBatch: 10
    adjudicateMaxTokens: 8192
