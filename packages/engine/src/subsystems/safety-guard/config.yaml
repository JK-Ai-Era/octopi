id: safety-guard
name: Safety Guard
description: 处理规则引擎无法判断的灰色地带，利用 LLM 的语义理解能力做风险判断

sense:
  source: eventBus
  filter:
    events: ['tool_call.risk_unknown']
  isolation: structured

think:
  implementation: llm
  strategy: heuristic
  model: mini
  maxIterations: 1

act:
  mode: block

signal:
  severity: advisory
  channel: [event]

boundary:
  visibility: structured
  authority: act
  # 第一方受审代码：显式声明 trusted（如实降级，不假装 sandboxed）。
  # 缺省值仍是 sandboxed——第三方子系统必须显式声明（SEC-6 fail-closed）。
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: session

lifecycle:
  maxDurationMs: 15000
  maxConcurrent: 1
  degradeOn: timeout
  onError: warn
