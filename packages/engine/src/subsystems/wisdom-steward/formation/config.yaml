id: wisdom.steward.formation
name: Wisdom Steward Formation
description: 从 Memory/Cognition 稳定结构炼制判断范式（maxim；多源门控；不写 Memory/Cognition）

sense:
  source: schedule
  # 8h 兜底脉搏；启动首跳 + memory.stored 增量触发补足响应速度
  interval: 28800000
  runOnStart: true
  cooldownMs: 3600000
  filter:
    condition: "true"
    # minEvents 对订阅事件统一累积：攒 5 条新记忆才放行；显式触发请走 trigger API
    minEvents: 5
    events: ['wisdom.steward.formation.request', 'memory.stored']
    emits: ['wisdom.steward.formed', 'wisdom.steward.formation.failed']
  isolation: isolated

think:
  # code = 调 handler.ts 确定性实现（llm 模式是自由 decide，handler 从未执行——2026-10-30 修复）
  implementation: code
  strategy: single
  model: mini
  maxIterations: 1

act:
  mode: inject

signal:
  severity: info
  channel: [event]

boundary:
  visibility: isolated
  authority: act
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: agent

lifecycle:
  maxConcurrent: 1
  maxDurationMs: 120000

runtimeInject:
  requires: ['wisdomStore', 'memoryStore']

observability:
  eventPrefix: wisdom.steward.formation

metadata:
  config:
    maxItemsPerRun: 2
    minMemorySupport: 2
    minClusterSize: 5
    maxEvidenceChars: 6000
    maxTokens: 8192
