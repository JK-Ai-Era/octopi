id: wisdom.steward.govern
name: Wisdom Steward Govern
description: 范式库治理：零应用衰减、容量演化、软退休（不污染主会话）

sense:
  source: schedule
  interval: 3600000
  filter:
    condition: "true"
    events: ['wisdom.steward.govern.request']
    emits: ['wisdom.steward.governed']
  isolation: isolated

think:
  implementation: code
  strategy: deterministic
  maxIterations: 1

act:
  mode: inject

signal:
  severity: info
  channel: [event]

boundary:
  visibility: isolated
  authority: act
  security: trusted

tools:
  mode: none

session:
  mode: ephemeral
  scope: agent

lifecycle:
  maxConcurrent: 1
  maxDurationMs: 15000

runtimeInject:
  requires: ['wisdomStore']

observability:
  eventPrefix: wisdom.steward.govern

metadata:
  config:
    dryRun: false
    softCap: 50
    hardCap: 80
    zeroApplyIdleMs: 2592000000
    priorityDecayStep: 5
    priorityFloor: 5
