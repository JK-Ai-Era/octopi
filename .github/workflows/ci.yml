# CI — 每次 push / PR 都跑。
#
# 设计原则：徽章必须"绿得有意义"。一个亮着绿灯但什么都没真正验证的徽章，
# 比没有徽章更糟——它训练读者不相信它。这里三件检查，每件都对应一个真实
# 存在、且此前无任何自动检查的退化：
#
#   1. npm test（build 之后）→ 5771 个测试。没有它，这些测试只是文件。
#   2. schema 同步检查        → AGENTS.md 要求"改 Zod 就重新生成 schema"，
#                              但这条纪律完全靠人记得。
#   3. npm run lint           → eslint + tests 类型基线 + webui tsc。
#
# ⚠️ 两条实证约束（第一次运行全红后查明的，不是推测）：
#
#   (a) 测试依赖构建产物。测试里有 `@octopi-agent/engine/harness` 这类裸导入，
#       它们经 package.json#exports 解析到 packages/engine/dist/，另有 gateway
#       测试 fork 的子进程入口 run-serve-child.js 也在 dist 内。全新 checkout
#       没有 dist，实测 52 个文件 / 136 个用例失败。所以 test job 必须先 build。
#
#   (b) 不要 `npm install --prefix packages/webui`。packages/webui 是 npm
#       workspace 成员（workspaces: ["packages/*"]），root `npm ci` 已把它的
#       依赖装到根 node_modules；实测 `tsc -p packages/webui --noEmit` 直接通过。
#       反而 --prefix 会脱离 workspace 上下文去 registry 查内部包版本，而仓库
#       版本长期领先于已发布版本（0.125.1 vs registry 0.122.0），导致 ETARGET。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行自动取消：省额度，也避免把过期结果当现行结论。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试不需要真实模型 key；显式置空，防止将来有人误加 secret 后测试悄悄
  # 变成依赖外部服务的 e2e。
  OPENAI_API_KEY: ''

jobs:
  # build 是 test 和 schema 的前置。单独成 job 便于看清失败归属，
  # 也让 lint 能并行、不被构建耗时拖慢。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与 package.json engines 一致（>=24）；Node 24 已是 Maintenance LTS。
          node-version: 24
          cache: npm

      # ci 而非 install：严格按 lockfile 装，可复现。CI 里跑 install 会改写
      # lockfile，那是事故。
      - run: npm ci

      - name: Build
        run: npm run build

      # 生成后若 octopi.schema.json 有任何变化，说明有人改了 Zod 却忘了提交
      # 生成结果 —— 这一步把 AGENTS.md 那条纪律机械化。
      - name: Schema is in sync with Zod
        run: |
          npm run generate:schema
          if ! git diff --exit-code octopi.schema.json; then
            echo "::error::octopi.schema.json is stale. Run 'npm run generate:schema' and commit the result."
            exit 1
          fi

      # 测试依赖 dist（见文件头约束 a），所以把构建产物传给 test job，
      # 避免重复构建。
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Test
        run: npm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, test types, webui types
        run: npm run lint
