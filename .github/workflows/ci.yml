# CI — 每次 push / PR 都跑。
#
# 设计原则：徽章必须"绿得有意义"。一个亮着绿灯但什么都没真正验证的徽章，
# 比没有徽章更糟——它训练读者不相信它。这里三件检查，每件都对应一个真实
# 存在、且此前无任何自动检查的退化：
#
#   1. npm test（build 之后）→ 5771 个测试。没有它，这些测试只是文件。
#   2. schema 同步检查        → AGENTS.md 要求"改 Zod 就重新生成 schema"，
#                              但这条纪律完全靠人记得。
#   3. npm run lint           → eslint + tests 类型基线 + webui tsc。
#
# ⚠️ 三条实证约束（第一次运行全红后查明的，不是推测）：
#
#   (a) 全部三个检查都依赖构建产物，不只是测试。各 package 的 package.json
#       把 `types` 指向 ./dist/*.d.ts，因此任何 tsc 检查（lint 里的
#       typecheck-tests 与 webui tsc）在没有 dist 时都会报
#       TS2307 "Cannot find module ..." 一片红。测试另有两处依赖：
#       `@octopi-agent/engine/harness` 这类裸导入经 exports 落到 packages/*/dist，
#       以及 gateway 测试 fork 的子进程入口 run-serve-child.js 也在 dist 内。
#       实测：无 dist 时 52 个测试文件 / 136 个用例失败，lint 报数十条 TS2307。
#       → build 必须作为 test 与 lint 的共同前置，不能只挂给 test。
#
#   (b) 不要 `npm install --prefix packages/webui`。packages/webui 是 npm
#       workspace 成员（workspaces: ["packages/*"]），root `npm ci` 已把它的
#       依赖装到根 node_modules。反而 --prefix 会脱离 workspace 上下文去 registry
#       查内部包版本，而仓库版本长期领先于已发布版本（0.125.2 vs registry
#       0.122.0），触发 ETARGET。
#
#   (c) actions/checkout@v5、actions/setup-node@v5 才声明 node24 运行时；
#       @v4 仍是 node20，会被强制运行并刷弃用警告。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行自动取消：省额度，也避免把过期结果当现行结论。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试不需要真实模型 key；显式置空，防止将来有人误加 secret 后测试悄悄
  # 变成依赖外部服务的 e2e。
  OPENAI_API_KEY: ''

jobs:
  # build 是 test 和 schema 的前置。单独成 job 便于看清失败归属，
  # 也让 lint 能并行、不被构建耗时拖慢。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与 package.json engines 一致（>=24）；Node 24 已是 Maintenance LTS。
          node-version: 24
          cache: npm

      # ci 而非 install：严格按 lockfile 装，可复现。CI 里跑 install 会改写
      # lockfile，那是事故。
      - run: npm ci

      - name: Build
        run: npm run build

      # 生成后若 octopi.schema.json 有任何变化，说明有人改了 Zod 却忘了提交
      # 生成结果 —— 这一步把 AGENTS.md 那条纪律机械化。
      - name: Schema is in sync with Zod
        run: |
          npm run generate:schema
          if ! git diff --exit-code octopi.schema.json; then
            echo "::error::octopi.schema.json is stale. Run 'npm run generate:schema' and commit the result."
            exit 1
          fi

      # 测试依赖 dist（见文件头约束 a），所以把构建产物传给 test job，
      # 避免重复构建。
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Test
        run: npm test

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint 也依赖 dist：各 package 的 types 指向 ./dist/*.d.ts，
      # typecheck-tests 与 webui tsc 缺了它会出现大量 TS2307（见文件头约束 a）。
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Lint, test types, webui types
        run: npm run lint
