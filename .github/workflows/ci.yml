# CI — 每次 push / PR 都跑。
#
# 设计原则：徽章必须"绿得有意义"。一个亮着绿灯但什么都没真正验证的徽章，
# 比没有徽章更糟——它训练读者不相信它。这里三件检查，每件都对应一个真实
# 存在、且此前无任何自动检查的退化：
#
#   1. npm test（build 之后）→ 5771 个测试。没有它，这些测试只是文件。
#   2. schema 同步检查        → AGENTS.md 要求"改 Zod 就重新生成 schema"，
#                              但这条纪律完全靠人记得。
#   3. npm run lint           → eslint + tests 类型基线 + webui tsc。
#
# 另外：push `v<X.Y.Z>` tag 时，build/test/lint 全绿之后由 `publish` job
# 发布五个包（依赖序 + 幂等规则见 scripts/publish.mjs）。发布不可逆，所以
# 触发条件刻意只认 tag —— 每个 content commit 都会 bump patch，若挂在 main
# 上就成了「每 merge 发五个包」。
#
# ⚠️ 三条实证约束（第一次运行全红后查明的，不是推测）：
#
#   (a) 全部三个检查都依赖构建产物，不只是测试。各 package 的 package.json
#       把 `types` 指向 ./dist/*.d.ts，因此任何 tsc 检查（lint 里的
#       typecheck-tests 与 webui tsc）在没有 dist 时都会报
#       TS2307 "Cannot find module ..." 一片红。测试另有两处依赖：
#       `@octopi-agent/engine/harness` 这类裸导入经 exports 落到 packages/*/dist，
#       以及 gateway 测试 fork 的子进程入口 run-serve-child.js 也在 dist 内。
#       实测：无 dist 时 52 个测试文件 / 136 个用例失败，lint 报数十条 TS2307。
#       → build 必须作为 test 与 lint 的共同前置，不能只挂给 test。
#
#   (b) 不要 `npm install --prefix packages/webui`。packages/webui 是 npm
#       workspace 成员（workspaces: ["packages/*"]），root `npm ci` 已把它的
#       依赖装到根 node_modules。反而 --prefix 会脱离 workspace 上下文去 registry
#       查内部包版本，而仓库版本长期领先于已发布版本（0.125.2 vs registry
#       0.122.0），触发 ETARGET。
#
#   (c) 所有 action 必须声明 node24 运行时。checkout@v5、setup-node@v5、
#       upload-artifact@v7、download-artifact@v8 均已是 node24；@v4 及以下仍是
#       node20，会被强制在 node24 上跑并刷 deprecation 警告。

name: CI

on:
  push:
    branches: [main]
    # Tag push 是发布按钮：同样的检查跑绿后，`publish` job 才发 npm。
    tags: ['v*']
  pull_request:

# 同一分支的旧运行自动取消：省额度，也避免把过期结果当现行结论。
# tag（发布）run 例外：发布跑到一半被后来的 tag run 取消会留下部分发布的包，
# 脚本虽然能续发，但没必要制造这种状态。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# 最小权限：CI 只读仓库；npm 凭证走 secret，不依赖 GitHub token。
permissions:
  contents: read

env:
  # 测试不需要真实模型 key；显式置空，防止将来有人误加 secret 后测试悄悄
  # 变成依赖外部服务的 e2e。
  OPENAI_API_KEY: ''

jobs:
  # build 是 test 和 schema 的前置。单独成 job 便于看清失败归属，
  # 也让 lint 能并行、不被构建耗时拖慢。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与 package.json engines 一致（>=24）；Node 24 已是 Maintenance LTS。
          node-version: 24
          cache: npm

      # ci 而非 install：严格按 lockfile 装，可复现。CI 里跑 install 会改写
      # lockfile，那是事故。
      - run: npm ci

      - name: Build
        run: npm run build

      # 生成后若 octopi.schema.json 有任何变化，说明有人改了 Zod 却忘了提交
      # 生成结果 —— 这一步把 AGENTS.md 那条纪律机械化。
      - name: Schema is in sync with Zod
        run: |
          npm run generate:schema
          if ! git diff --exit-code octopi.schema.json; then
            echo "::error::octopi.schema.json is stale. Run 'npm run generate:schema' and commit the result."
            exit 1
          fi

      # 测试依赖 dist（见文件头约束 a），所以把构建产物传给 test job，
      # 避免重复构建。
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Test
        run: npm test

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint 也依赖 dist：各 package 的 types 指向 ./dist/*.d.ts，
      # typecheck-tests 与 webui tsc 缺了它会出现大量 TS2307（见文件头约束 a）。
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Lint, test types, webui types
        run: npm run lint

  # 发布（仅 tag）：打 `v<X.Y.Z>` 才跑，且必须 build/test/lint 全绿。
  #
  # 凭证：repo secret `NPM_TOKEN`，必须能在无 OTP 的情况下发布（npm Automation
  # token，或 granular token 勾了 2FA bypass + 该 scope 的 read/write）。账号开
  # 2FA 而 token 不是这两类时 npm 会以 EOTP 失败——下面这步只挡「secret 没配」。
  #
  # 不加 --provenance：它要求公开仓库 + id-token: write，仓库可见性一旦变化就会
  # 卡在不可回滚的那一步上。要启用时两者一起加。
  publish:
    needs: [build, test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 全历史：下面的「tag 必须在 main 上」判断需要真实祖先链（浅克隆会让
      # merge-base 直接判否）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # 写 .npmrc 的 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry-url: https://registry.npmjs.org

      # 用 build job 产出并上传的 dist（约束 a）：发布必须用同一份跑绿的产物，
      # 不在 publish job 里重新构建。也不需要 npm ci —— 打包只读 package.json
      # 和 files 清单，没有 prepack/prepare 脚本。
      - uses: actions/download-artifact@v8
        with:
          name: dist

      # 只发已合并的代码：tag 打在特性分支上时拒绝发布。npm 上的版本无法撤回，
      # 发出去的未合并代码只能靠再发一版覆盖。
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main — refusing to publish unmerged code"
            exit 1
          fi

      - name: npm token is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::repo secret NPM_TOKEN is missing — add an npm Automation token (or a granular token with 2FA bypass)"
            exit 1
          fi

      # 依赖序 + 已存在则跳过（可重试）：规则与取舍写在脚本头部注释里。
      # 版本/tag 一致性、tarball 残渣、版本回退等守卫都在脚本内（本地可复用）。
      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs
