  - { id: governance/security, domain: governance }
  - { id: governance/human-in-the-loop, domain: governance }
  - { id: governance/credentials, domain: governance }
  - { id: governance/accounting, domain: governance }

  # Session
  - { id: session, domain: session }
  - { id: session/tasks, domain: session }
  - { id: session/history, domain: session }

