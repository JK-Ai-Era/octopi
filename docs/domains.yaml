  - { id: run, domain: run }
  - { id: run/agent, domain: run }
  - { id: run/reliability, domain: run }
  - { id: run/run-guard, domain: run }
  - { id: run/budget, domain: run }
  - { id: run/concurrency, domain: run }
  - { id: run/model, domain: run }

